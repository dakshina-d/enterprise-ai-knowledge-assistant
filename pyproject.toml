[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "Enterprise AI knowledge assistant technical-assessment foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "streamlit>=1.41,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
files = ["backend/src", "frontend"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["backend/tests", "mcp_server/tests", "ingestion/tests", "tests"]
pythonpath = ["backend/src"]
