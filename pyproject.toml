[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-knowledge-assistant"
version = "0.1.0"
description = "Enterprise AI knowledge assistant technical-assessment foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = [
  "argon2-cffi>=23.1,<26.0",
  "fastapi>=0.115,<1.0",
  "langgraph>=1.2,<2.0",
  "openai>=2.45,<3.0",
  "PyJWT>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "pinecone>=9.0,<10.0",
  "PyYAML>=6.0,<7.0",
  "streamlit>=1.41,<2.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.14,<2.0",
  "pre-commit>=4.0,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio<2.0,>=0.24",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
  "types-PyYAML>=6.0,<7.0",
]

[tool.setuptools]
package-dir = { "" = "backend/src", enterprise_ai_ingestion = "ingestion/src/enterprise_ai_ingestion" }

[tool.setuptools.packages.find]
where = ["backend/src", "ingestion/src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101", "S105", "S106"]
"backend/tests/unit/retrieval/**/*.py" = ["ANN401", "S101", "S105", "S106"]
"ingestion/tests/**/*.py" = ["S101", "S105", "S106"]
"backend/src/enterprise_ai/retrieval/dense_retriever.py" = ["ANN401"]
"backend/src/enterprise_ai/retrieval/embeddings.py" = ["ANN401"]
"backend/src/enterprise_ai/retrieval/evaluation.py" = ["ANN401"]
"backend/src/enterprise_ai/retrieval/pinecone_client.py" = ["ANN401"]
"scripts/generate_sample_documents.py" = ["E501"]
"scripts/validate_sample_documents.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["backend/src", "ingestion/src"]
files = ["backend/src", "frontend", "ingestion/src", "scripts"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["backend/tests", "mcp_server/tests", "ingestion/tests", "tests"]
pythonpath = ["backend/src", "ingestion/src"]
markers = ["pinecone_live: explicitly enabled Pinecone integration tests"]
